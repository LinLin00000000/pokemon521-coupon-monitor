name: Monitor public Telegram sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon521-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run read-only monitor
        run: python monitor.py --max-messages 100 --max-pages 8

      - name: Publish changed data only
        shell: bash
        run: |
          if git diff --quiet -- data/latest.json data/history.jsonl; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.jsonl
          git commit -m "chore: update public coupon scan"
          git push
