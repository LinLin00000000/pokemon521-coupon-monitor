name: Monitor public Telegram sources

on:
  # GitHub Actions cron uses UTC. Six runs/day during days 1-7 is
  # intentionally limited to the monthly activity window.
  schedule:
    - cron: "17 0,4,8,12,16,20 1-7 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon521-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run read-only monitor
        run: python monitor.py --max-messages 100 --max-pages 8 --max-discussion-posts 3 --max-comments 500 --lock-observations 3

      - name: Publish changed data only
        shell: bash
        run: |
          if git diff --quiet -- data/latest.json data/history.jsonl data/state.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.jsonl data/state.json
          git commit -m "chore: update public coupon scan"
          git push
